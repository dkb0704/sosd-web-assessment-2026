<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一个组件：个人卡片</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box;
            font-family:"微软雅黑",sans-serif;
        }
        body {
        background-color:rgb(251, 232, 196);
        padding: 40px;
    }
    .card{
        width: 300px;
        margin: 0 auto;
        background: white;
        border-radius: 13px;
        padding: 25px;
        box-shadow:0 4px 12px rgb(247, 205, 129);
        text-align: center;
        margin-bottom: 20px;
    }
    .card h2{
        color:rgb(26, 44, 53);
        font-family:"华文新魏",serif;
        margin-bottom: 15px 0;
        font-size: 30px;
    }
    .card p{
        font-family:"幼圆",serif;
        font-weight: 800;
        text-align: left;
        color:#4a3b29;
        margin: 8px 0;
    }
    .card img{
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin: 10px 0;
        border: 3px solid rgb(119, 212, 255);
        box-shadow: 0 0 8px rgb(119, 212, 255);
        padding: 3px;
    }
    .card ul {
            text-align: left;
            list-style: none;
            margin: 10px 0;
        }
        .card li {
            font-family:"Noto Sans SC Black",serif;
            text-align: left;
            margin: 2px 0;
            color:#936833;
        }
        .card a {
            font-family:"华文行楷",serif;
            text-align: center;
            color: rgb(28, 142, 249);
        }
        .card img:hover {
    transform: scale(1.2); 
    box-shadow: 0 0 15px rgb(119, 212, 255);
    cursor: pointer; 
        }
        .card:hover {
    transform: translateY(-2px); 
    box-shadow: 0 10px 20px rgb(247, 205, 129);
    background: #ffffff; 
    transform: scale(1.05);
    cursor: pointer;
    }
        .card h2:hover{
            transform: scale(1.2);
            color:rgb(26, 44, 53);
        }
        .card a:hover{
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align: center; margin-bottom: 30px;">
        欢迎来到LSY的个人空间~
    </h1>
</header>
<main>
    <div class="card">
    <img src="xyy2.png" alt="学习">
        <h2>
            林诗妍
        </h2>
    <p>
        是努力学习前端的新手小白一枚orz
    </p>
    <p>
        专业：计算机科学与技术
    </p>
    <hr>
    <p>爱好：</p>
    <ul>
        <li>painting</li>
        <li>singing</li>
        <li>sleeping(但是经常失眠)</li>
    </ul>
    <hr>
    <a href="https://www.msn.cn/zh-cn/weather/forecast/in-%E9%97%BD%E4%BE%AF%E5%8E%BF?loc=eyJsIjoi6Ze95L6v5Y6%2FIiwiYyI6IuS4reWNjuS6uuawkeWFseWSjOWbvSIsImkiOiJDTiIsIngiOiIxMTkuMjU2NSIsInkiOiIyNi4xMDEzIn0%3D&weadegreetype=C&ocid=ansmsnweather">!点击即达我想复刻的网页!</a>
    </div>
</main>
</body>
</html>
