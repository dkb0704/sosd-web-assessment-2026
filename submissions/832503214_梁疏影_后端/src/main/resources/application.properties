spring.application.name=computing-power-rental
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.computingpowerrental.entity
mybatis.configuration.map-underscore-to-camel-case=true
jwt.secret-key=${JWT_SECRET_KEY:computing-power-rental-secret-key-please-change-in-production}
jwt.access-token-expiration=7200
jwt.refresh-token-expiration=604800
jwt.token-prefix=Bearer
jwt.token-header=Authorization

spring.data.redis.host=localhost
spring.data.redis.port=6379

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/computing_power_rental?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# =========================
# Alipay Sandbox
# =========================
alipay.app-id=${ALIPAY_APP_ID:}
alipay.private-key=${ALIPAY_PRIVATE_KEY:}
alipay.alipay-public-key=${ALIPAY_PUBLIC_KEY:}
alipay.gateway-url=https://openapi-sandbox.dl.alipaydev.com/gateway.do
alipay.format=JSON
alipay.charset=UTF-8
alipay.sign-type=RSA2
alipay.return-url=http://localhost:8080/api/payment/alipay/return
alipay.notify-url=http://localhost:8080/api/payment/alipay/notify