spring:
  application:
    name: ai-computer-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_computer_platform?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 密码

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 465
    username: 邮箱
    password: 授权码  # 请统一使用正确的授权码
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
            required: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: "mySecretKey12345678901234567890123456789012"  # 至少32位
  expiration: 86400000  # 24小时（毫秒）

